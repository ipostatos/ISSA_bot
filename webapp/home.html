<style>
  /* — дашборд: специфика главного экрана — */
  .hero{ display:flex; align-items:baseline; gap:var(--sp-2); margin-bottom:var(--sp-1) }
  .hero .logo{ font-size:24px }

  /* приоритетный блок «что дальше» */
  .next{ background:linear-gradient(180deg, var(--card), var(--card));
    border:1px solid var(--border); border-radius:var(--r-lg);
    padding:var(--sp-4); margin-bottom:var(--sp-4); box-shadow:var(--shadow) }
  .next .label{ font-size:var(--fs-xs); letter-spacing:.04em; text-transform:uppercase;
    color:var(--hint); margin-bottom:var(--sp-2) }
  .next .big{ font-size:var(--fs-h2); font-weight:700; margin-bottom:var(--sp-1) }
  .next .hintline{ color:var(--hint); font-size:var(--fs-sm); margin-bottom:var(--sp-3) }
  .next .actions{ display:flex; gap:var(--sp-2) }
  .next .actions .btn{ width:auto; flex:1 }

  /* сетка разделов 2 колонки */
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-2) }
  .cell{ display:flex; flex-direction:column; gap:var(--sp-1);
    text-decoration:none; color:var(--text); background:var(--card);
    border:1px solid var(--border); border-radius:var(--r-md);
    padding:var(--sp-3) var(--sp-4); min-height:84px; transition:transform .12s }
  .cell:active{ transform:scale(.98) }
  .cell .ic{ font-size:24px; line-height:1 }
  .cell .t{ font-size:var(--fs-body); font-weight:700 }
  .cell .d{ color:var(--hint); font-size:var(--fs-xs); line-height:1.35 }
  .cell.wide{ grid-column:1 / -1; flex-direction:row; align-items:center; gap:var(--sp-3); min-height:0 }
  .cell.wide .body{ flex:1 } .cell.wide .chev{ color:var(--hint) }

  .section-title{ font-size:var(--fs-sm); font-weight:700; color:var(--hint);
    margin:var(--sp-4) 0 var(--sp-2); text-transform:uppercase; letter-spacing:.03em }
  .emi{ display:inline-flex; vertical-align:-2px } .emi svg{ width:1em; height:1em }
  /* BETA:weather — маркер бета-плитки; удаляется вместе с фичей */
  .beta-badge{ font-size:9px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent); border:1px solid var(--accent); border-radius:999px;
    padding:1px 5px; margin-left:4px; vertical-align:1px; opacity:.85 }

  /* свайп-карусель «Готовность» по лицензиям */
  .ready-track{ display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch; scrollbar-width:none; padding-bottom:2px }
  .ready-track::-webkit-scrollbar{ display:none }
  .ready-slide{ flex:0 0 100%; scroll-snap-align:center; min-width:0 }
  .ready-dots{ display:flex; justify-content:center; gap:6px; margin-top:8px }
  .ready-dots i{ width:6px; height:6px; border-radius:50%; background:var(--border);
    transition:background .2s, width .2s }
  .ready-dots i.on{ background:var(--accent); width:18px; border-radius:3px }
  .pl-mini{ display:flex; gap:10px; margin-top:12px }
  .pl-mini > div{ flex:1; text-align:center; padding:10px; border:1px solid var(--border); border-radius:12px }
  .pl-mini .k{ font-size:11px; color:var(--hint) }
  .pl-mini .v{ font-weight:800; font-size:18px }
</style>
</head>
<body>

<script>
"use strict";
// BETA:weather — рубильник бета-плитки «Погода». false → плитка скрыта,
// разметку и weather.html можно не трогать. Удалить фичу целиком:
// снести этот блок, стиль .beta-badge и <!-- BETA:weather ... /BETA -->.
var WEATHER_BETA = true;
if (!WEATHER_BETA){
  var wt = document.querySelector('[data-beta="weather"]');
  if (wt) wt.remove();
}

// заменить data-icon на SVG-иконки (Lucide) сразу при загрузке
if (window.Icons) Icons.hydrate();

// переключатель языка в шапке
(function () {
  var chip = document.getElementById("langChip");
  if (chip && window.I18N) {
    chip.textContent = I18N.lang.toUpperCase() + " · " + I18N.t("langBtn");
    chip.onclick = function () { I18N.picker(true); };
  }
})();

// Оживляем блок «С чего начать»: если есть вопросы к повтору по SRS —
// предлагаем повторение приоритетом, иначе обычный старт. Всё на устройстве.
function render(){
  const D = window.QUIZ_DATA;
  const total = D && D.meta ? D.meta.total : (D && D.questions ? D.questions.length : 0);
  // дефолт приоритетного блока (перебивается ниже, если есть что повторять)
  const startIc = window.Icons ? Icons.svg("graduation-cap") : "";
  document.getElementById("nextLabel").textContent = I18N.t("nextStart");
  document.getElementById("nextTitle").textContent = I18N.t("nextTrain");
  const nb = document.getElementById("nextBtn");
  nb.innerHTML = `${startIc} ${I18N.t("btnStart")}`; nb.href = "quiz.html";
  if (D && D.questions) document.getElementById("nextHint").textContent = I18N.t("nextHint", {n: total});
  if (!window.SRS || !D || !D.questions) return;

  const ids = D.questions.map(q=>q.id);
  const due = SRS.dueCount(ids);
  const st = SRS.stats(ids);
  if (due > 0 && st.started > 0){
    // есть что повторять — делаем это главным действием
    document.getElementById("nextLabel").textContent = I18N.t("dueLabel");
    const ic = window.Icons ? Icons.svg("refresh-cw") : "";
    document.getElementById("nextTitle").innerHTML = `${ic} ${I18N.t("dueTitle", {n: due})}`;
    document.getElementById("nextHint").textContent = I18N.t("dueHint", {done: st.learned, total: total});
    const b = document.getElementById("nextBtn");
    b.innerHTML = `${ic} ${I18N.t("btnReview")}`;
    // сразу В сессию повторения, без промежуточного меню тестов — одна
    // кнопка = одно действие (quiz.html понимает ?mode=review)
    b.href = "quiz.html?mode=review";
  } else if (st.started > 0){
    document.getElementById("nextLabel").textContent = I18N.t("keepUp");
    document.getElementById("nextHint").textContent = I18N.t("allDone", {done: st.learned, total: total});
  }

  // ── «Готовность» — свайп по лицензиям (ISSA + польские) ──
  // Показываем блок, если есть активность хоть где-то: ISSA (SRS) или PL.
  const plZ = window.PLProgress ? PLProgress.solvedCount("zeglarz") : 0;
  const plS = window.PLProgress ? PLProgress.solvedCount("sternik") : 0;
  const anyActivity = (window.Progress && st.started > 0) || plZ > 0 || plS > 0;

  if (anyActivity){
    // — слайд ISSA — заполняем всегда (даже с 0%, если ISSA ещё не начат) —
    if (window.Progress){
      const boxOf = id => { const s = SRS.state(id); return s ? s.box : null; };
      const r = Progress.readiness(D.questions, boxOf);
      const goal = Progress.getGoal();
      const todayN = Progress.todayCount();
      const streak = Progress.streakInfo();
      document.getElementById("readyPct").textContent = r.percent + "%";
      const ring = document.getElementById("readyRing");
      ring.style.setProperty("--p", r.percent);
      ring.style.setProperty("--ring-color",
        r.percent>=80 ? "var(--ok)" : r.percent>=50 ? "var(--warn)" : "var(--bad)");
      document.getElementById("readyVerdict").textContent = r.verdict;
      document.getElementById("goalToday").textContent = `${todayN}/${goal}`;
      // ❄ делает механику заморозки видимой: синяя снежинка — страховка цела
      // (один пропуск серию не порвёт), янтарная — серия прямо сейчас «на льду»
      // (вчера был пропуск: без ответов сегодня она сгорит).
      const flake = !window.Icons ? ""
        : streak.onIce ? `<span style="color:var(--warn)" title="Серия на льду — позанимайся сегодня!">${Icons.svg("snowflake")}</span>`
        : streak.frozenAvailable ? `<span style="color:var(--accent);opacity:.7" title="Заморозка цела: один пропуск не страшен">${Icons.svg("snowflake")}</span>`
        : "";
      document.getElementById("streakVal").innerHTML =
        `${streak.streak} ${window.Icons ? Icons.svg("flame") : ""}${flake}`;
      document.getElementById("bestVal").textContent = `${streak.best}`;
      document.getElementById("goalBox").onclick = ()=>{
        const cur = Progress.getGoal();
        const v = prompt(I18N.t("promptGoal"), cur);
        if (v === null) return;
        const n = parseInt(v, 10);
        if (!isNaN(n)){ Progress.setGoal(n); if (window.Sync) Sync.schedulePush(); render(); }
      };
      const weak = r.topics.filter(t=>t.pct<60).slice(0,3).map(t=>t.topic);
      document.getElementById("weakLine").textContent =
        weak.length ? I18N.t("weakTop", {list: weak.join(", ")}) : I18N.t("noWeak");

      // ── план к дате экзамена: превращает абстрактный % в личный дедлайн ──
      renderExamPlan(D.questions, boxOf);
    }

    // — польские слайды (Żeglarz 150 / Sternik 460) —
    renderPlSlide("zeglarz", "Żeglarz jachtowy", 150, "anchor");
    renderPlSlide("sternik", "Sternik motorowodny", 460, "compass");

    document.getElementById("readyWrap").classList.remove("hidden");
    setupReadyDots();

    // heatmap активности (учитывает и польские ответы — они пишутся в Progress)
    if (window.Heatmap){
      document.getElementById("activityCard").classList.remove("hidden");
      Heatmap.render(document.getElementById("heatmap"), { weeks: 18 });
    }
  }

  // подпись плитки профиля: сколько достижений открыто
  document.getElementById("profileSub").textContent = I18N.t("cProfileD");
  if (window.Badges){
    const bm = Badges.computeMetrics();
    const nb = Badges.unlockedCount(bm), tot = Badges.DEFS.length;
    document.getElementById("profileSub").textContent = I18N.t("achOf", {n: nb, tot: tot});
  }
}

// План к дате экзамена: дата → осталось дней → дневная норма (повторы до
// закрепления / дни). Клик — задать или изменить дату (пустой ввод = убрать).
function renderExamPlan(questions, boxOf){
  const el = document.getElementById("examPlanLine");
  if (!el || !window.Progress || !Progress.examPlan) return;
  const ic = n => window.Icons ? Icons.svg(n) : "";
  const plan = Progress.examPlan(questions, boxOf);
  if (!plan){
    el.innerHTML = `<span style="color:var(--accent)">${ic("calendar")} ${I18N.t("setExamDate")}</span>`;
  } else {
    const [y, m, d] = plan.date.split("-");
    const col = plan.onTrack ? "var(--ok)" : "var(--warn)";
    const dayWord = plan.daysLeft === 0 ? I18N.t("examToday")
      : I18N.t("daysLeft", {n: plan.daysLeft});
    el.innerHTML = `${ic("calendar")} ${I18N.t("examOn", {date: d + "." + m, left: dayWord})}` +
      (plan.reviewsLeft === 0
        ? ` · <span style="color:var(--ok)">${I18N.t("bankReady")} ${ic("check")}</span>`
        : ` · <span style="color:${col}">${I18N.t("needPerDay", {n: plan.needPerDay})}</span>` +
          (plan.onTrack ? "" : ` ${I18N.t("raiseGoal", {g: Progress.getGoal()})}`));
  }
  el.onclick = ()=>{
    const cur = Progress.getExamDate() || "";
    const v = prompt(I18N.t("promptDate"), cur);
    if (v === null) return;
    const t = v.trim();
    if (!t){ Progress.setExamDate(null); render(); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(t) || isNaN(Date.parse(t))){
      alert(I18N.t("badDate")); return;
    }
    Progress.setExamDate(t);
    render();
  };
}

// заполнить слайд готовности польской лицензии
function renderPlSlide(lic, title, total, icon){
  const el = document.querySelector(`.pl-slide[data-lic="${lic}"]`);
  if (!el || !window.PLProgress) return;
  const r = PLProgress.readiness(lic, total);
  const best = PLProgress.bestExam(lic);
  const color = r.percent>=80 ? "var(--ok)" : r.percent>=50 ? "var(--warn)" : "var(--bad)";
  const ic = window.Icons ? Icons.svg(icon) : "";
  el.innerHTML =
    `<div style="display:flex; align-items:center; gap:16px">
       <div class="ring" style="--p:${r.percent}; --ring-color:${color}">
         <div class="ring-val"><span class="ring-num">${r.percent}%</span></div>
       </div>
       <div style="flex:1; min-width:0">
         <div class="h2" style="margin:0 0 4px">${I18N.t("readyOf", {title: title})}</div>
         <div class="muted" style="font-size:13px">${r.verdict}</div>
       </div>
     </div>
     <div class="pl-mini">
       <div><div class="k">${I18N.t("lblLearned")}</div><div class="v">${r.solved}/${total}</div></div>
       <div><div class="k">${I18N.t("lblBestExam")}</div><div class="v">${best ? best.correct+"/"+best.total : "—"}</div></div>
       <div><div class="k">${I18N.t("lblThreshold")}</div><div class="v">65</div></div>
     </div>
     <a class="muted" href="exam_pl.html" style="display:block; font-size:12px; margin-top:8px;
        color:var(--accent); text-decoration:none">${I18N.t("openTrainer")}</a>`;
}

// точки-индикаторы под каруселью + подсветка активного слайда при свайпе
function setupReadyDots(){
  const track = document.getElementById("readyTrack");
  const dots = document.getElementById("readyDots");
  const slides = track.querySelectorAll(".ready-slide");
  if (!dots.childElementCount){
    slides.forEach(() => dots.appendChild(document.createElement("i")));
  }
  const sync = () => {
    const i = Math.round(track.scrollLeft / track.clientWidth);
    dots.querySelectorAll("i").forEach((d, k) => d.classList.toggle("on", k === i));
  };
  track.onscroll = sync;
  sync();
}

render();
// синхрон с сервером: подтянуть прогресс с других устройств и перерисовать.
if (window.Sync && Sync.enabled){
  Sync.pull().then(function(changed){ if (changed) render(); });
}
</script>
