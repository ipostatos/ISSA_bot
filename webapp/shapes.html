<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title data-i18n="shapeTitle">Фигуры и флаги</title>
<link rel="stylesheet" href="theme.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="nav.js"></script>
<script src="i18n.dict.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="shapes_data.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #17212b);
    --text: var(--tg-theme-text-color, #fff);
    --hint: var(--tg-theme-hint-color, #8a9aa9);
    --card: var(--tg-theme-secondary-bg-color, #232e3c);
    --accent: var(--tg-theme-button-color, #50a8eb);
    --accent-text: var(--tg-theme-button-text-color, #fff);
    --border: rgba(255,255,255,.10);
    --ok:#4caf72; --bad:#e5544b;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg: var(--tg-theme-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #1a1a1a);
      --hint: var(--tg-theme-hint-color, #7d8a99);
      --card: var(--tg-theme-secondary-bg-color, #f1f3f5);
      --accent: var(--tg-theme-button-color, #3390ec);
      --accent-text: var(--tg-theme-button-text-color, #ffffff);
      --border: rgba(0,0,0,.10);
    }
  }
  *{box-sizing:border-box}
  body{margin:0; padding:14px; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); line-height:1.5; -webkit-tap-highlight-color:transparent}
  h1{font-size:19px; margin:0 0 2px}
  .sub{color:var(--hint); font-size:13px; margin:0 0 14px}
  .hidden{display:none !important}
  .card{background:var(--card); border-radius:14px; padding:14px; margin-bottom:12px}
  .btn{display:block; width:100%; padding:14px; font-size:15px; font-weight:600; border:none;
    border-radius:12px; background:var(--accent); color:var(--accent-text); cursor:pointer;
    margin-bottom:10px; text-align:left}
  .btn small{display:block; font-weight:400; font-size:12px; opacity:.85; margin-top:2px}
  .btn.ghost{background:transparent; color:var(--text); border:1px solid var(--border)}
  .row{display:flex; gap:10px}

  /* сцена: сумерки на море (единый стиль с «Буями») */
  .scene{ position:relative; width:100%; aspect-ratio:1/1; max-height:320px; border-radius:16px;
    overflow:hidden; border:1px solid var(--border);
    background:linear-gradient(#071224 0%, #10304d 45%, #061c2e 100%) }
  .scene canvas{ position:absolute; inset:0; width:100%; height:100%; display:block }
  .scene-cap{ position:absolute; left:0; right:0; bottom:8px; text-align:center; font-size:12px;
    color:#9fc4e0; text-shadow:0 1px 3px #000; pointer-events:none }

  /* большие кнопки меню (как у «Буёв») */
  .big{width:100%; padding:15px; margin-bottom:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); border-radius:14px; cursor:pointer;
    font-size:16px; font-weight:600; text-align:left; display:flex; align-items:center; gap:12px}
  .big .bic{flex:0 0 auto; color:var(--accent)}
  .big small{display:block; font-weight:400; font-size:13px; opacity:.85; margin-top:2px}

  /* список справочника: круглые иконки-«иллюминаторы» */
  .item{display:flex; align-items:center; gap:12px; width:100%; text-align:left;
    padding:10px 12px; margin-bottom:8px; border:1px solid var(--border);
    background:var(--card); color:var(--text); border-radius:12px; cursor:pointer}
  .item canvas{flex:0 0 auto; width:56px; height:56px; border-radius:50%;
    border:1px solid var(--border)}
  .item .t{font-size:14px; font-weight:600}
  .item .m{font-size:12px; color:var(--hint)}
  /* карточка: сцена вместо плоской подложки */
  .stage{padding:0}
  .info{background:var(--bg); border:1px solid var(--border); border-radius:10px;
    padding:12px; font-size:14px; margin-top:10px}
  .info .note{color:var(--hint); font-size:13px; margin-top:6px}
  /* тест */
  .opt{display:block; width:100%; text-align:left; padding:13px; margin-bottom:9px; font-size:14px;
    border:1px solid var(--border); background:var(--bg); color:var(--text); border-radius:11px; cursor:pointer}
  .opt.correct{border-color:var(--ok); background:rgba(76,175,114,.16)}
  .opt.wrong{border-color:var(--bad); background:rgba(229,84,75,.16)}
  .opt[disabled]{cursor:default}
  .score{font-size:15px; font-weight:700; text-align:center; margin-top:8px}
</style>
</head>
<body>

<!-- МЕНЮ -->
<section id="menu">
  <h1><span class="emi" data-icon="triangle"></span> <span data-i18n="shapeTitle"></span></h1>
  <p class="sub" data-i18n="shapeSub"></p>
  <div class="scene" style="margin-bottom:14px">
    <canvas id="menuScene"></canvas>
    <div class="scene-cap" data-i18n="shapeCapMenu"></div>
  </div>
  <button class="big" id="goShapes">
    <span class="bic" data-icon="triangle"></span>
    <span><span data-i18n="shapeDay"></span><small data-i18n="shapeDaySub"></small></span>
  </button>
  <button class="big" id="goFlags">
    <span class="bic" data-icon="flag"></span>
    <span><span data-i18n="shapeFlags"></span><small data-i18n="shapeFlagsSub"></small></span>
  </button>
  <button class="big" id="goQuiz">
    <span class="bic" data-icon="graduation-cap"></span>
    <span><span data-i18n="shapeQuiz"></span><small data-i18n="shapeQuizSub"></small></span>
  </button>
</section>

<!-- СПРАВОЧНИК (список) -->
<section id="learn" class="hidden">
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" id="learnBack" style="flex:0 0 auto; width:auto; padding:9px 14px" data-i18n="shapeMenu"></button>
    <div style="flex:1; align-self:center; font-weight:700" id="learnTitle"></div>
  </div>
  <div id="learnList"></div>
</section>

<!-- КАРТОЧКА -->
<section id="view" class="hidden">
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" id="viewBack" style="flex:0 0 auto; width:auto; padding:9px 14px" data-i18n="shapeList"></button>
    <div style="flex:1; align-self:center; font-weight:700" id="viewTitle"></div>
  </div>
  <div class="card">
    <div class="stage"><div class="scene"><canvas id="viewCanvas"></canvas></div></div>
    <div class="info">
      <div id="viewMeaning" style="font-weight:600"></div>
      <div class="note" id="viewNote"></div>
    </div>
  </div>
</section>

<!-- ТЕСТ -->
<section id="quiz" class="hidden">
  <div class="row" style="margin-bottom:10px">
    <button class="btn ghost" id="quizBack" style="flex:0 0 auto; width:auto; padding:9px 14px" data-i18n="shapeMenu"></button>
    <div style="flex:1; text-align:right; color:var(--hint); font-size:13px; align-self:center" id="quizCounter"></div>
  </div>
  <div class="card">
    <div class="stage"><div class="scene"><canvas id="quizCanvas"></canvas></div></div>
    <div style="margin-top:6px; font-weight:600" id="quizQ" data-i18n="shapeWhat"></div>
    <div id="quizOpts" style="margin-top:10px"></div>
    <div class="row" id="quizCtrl" style="display:none">
      <button class="btn" id="quizNext" style="margin:0" data-i18n="shapeNext"></button>
    </div>
    <div class="score" id="quizScore"></div>
  </div>
</section>

<script>
"use strict";
if (window.Icons) Icons.hydrate();
const D = window.SHAPES_DATA || { dayshapes: [], flags: [] };

// ─────────────────── Единая сцена: сумерки на море (стиль «Буёв») ───────────────────
function fitCanvas(canvas, fixW, fixH){
  const dpr = window.devicePixelRatio || 1;
  let W = fixW, H = fixH;
  if (!W){
    const r = canvas.getBoundingClientRect();
    W = Math.max(40, r.width); H = Math.max(40, r.height);
  }
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W, H };
}
function sceneBG(ctx, W, H, t){
  const hor = H * 0.72;
  const sky = ctx.createLinearGradient(0, 0, 0, hor);
  sky.addColorStop(0, "#071224"); sky.addColorStop(0.55, "#10304d");
  sky.addColorStop(0.85, "#1b4869"); sky.addColorStop(1, "#28597b");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hor + 1);
  const sea = ctx.createLinearGradient(0, hor, 0, H);
  sea.addColorStop(0, "#175074"); sea.addColorStop(0.16, "#0f3d5c");
  sea.addColorStop(0.55, "#0a2c44"); sea.addColorStop(1, "#061c2e");
  ctx.fillStyle = sea; ctx.fillRect(0, hor, W, H - hor);
  for (let i = 0; i < 14; i++){                       // мерцающие звёзды
    const sx = (i * 137.5) % W, sy = (i * 61) % (hor * 0.75);
    const a = 0.20 + 0.35 * Math.abs(Math.sin(t * 0.9 + i * 1.7));
    ctx.fillStyle = "rgba(220,235,255," + a.toFixed(2) + ")";
    ctx.fillRect(sx, sy, 1.4, 1.4);
  }
  ctx.strokeStyle = "rgba(180,220,250,.18)"; ctx.lineWidth = 1;   // блики на воде
  for (let i = 0; i < 7; i++){
    const y = hor + 5 + i * 6, w2 = 16 + (i * 37) % (W * 0.30), x = (W - w2) / 2 + Math.sin(t * 0.7 + i) * 7;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w2, y); ctx.stroke();
  }
}
// судно-силуэт на воде; возвращает координаты мачты
function drawVessel(ctx, W, H){
  const wl = H * 0.80, cx = W * 0.5;
  ctx.fillStyle = "#0c1620";
  ctx.beginPath();
  ctx.moveTo(cx - W * 0.30, wl - H * 0.05); ctx.lineTo(cx + W * 0.30, wl - H * 0.05);
  ctx.lineTo(cx + W * 0.235, wl + H * 0.012); ctx.lineTo(cx - W * 0.235, wl + H * 0.012);
  ctx.closePath(); ctx.fill();
  ctx.fillRect(cx + W * 0.09, wl - H * 0.105, W * 0.13, H * 0.058);   // надстройка
  ctx.fillStyle = "rgba(8,18,28,.45)";                                 // отражение
  ctx.fillRect(cx - W * 0.235, wl + H * 0.014, W * 0.47, H * 0.022);
  return { mastX: cx - W * 0.03, mastTop: H * 0.09, deckY: wl - H * 0.05 };
}
function drawMastLine(ctx, x, y0, y1){
  ctx.strokeStyle = "#5a6b78"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x, y1); ctx.stroke();
}

// ─────────────────── Дневные фигуры: чёрные силуэты с подсветкой ───────────────────
function figH(f, s){ return f === "cones-apex" ? s * 1.7 : f === "cylinder" ? s * 1.6 : s; }
function drawFigure(ctx, f, cx, top, s, h){
  const r = s / 2;
  ctx.beginPath();
  if (f === "ball"){
    ctx.arc(cx, top + r, r, 0, Math.PI * 2);
  } else if (f === "diamond"){
    ctx.moveTo(cx, top); ctx.lineTo(cx + r, top + r); ctx.lineTo(cx, top + s); ctx.lineTo(cx - r, top + r);
  } else if (f === "cone-up"){
    ctx.moveTo(cx, top); ctx.lineTo(cx + r, top + s); ctx.lineTo(cx - r, top + s);
  } else if (f === "cone-down"){
    ctx.moveTo(cx - r, top); ctx.lineTo(cx + r, top); ctx.lineTo(cx, top + s);
  } else if (f === "cones-apex"){
    // два конуса вершинами вместе («песочные часы»)
    const mid = top + h / 2;
    ctx.moveTo(cx - r, top); ctx.lineTo(cx + r, top); ctx.lineTo(cx, mid);
    ctx.moveTo(cx, mid); ctx.lineTo(cx + r, top + h); ctx.lineTo(cx - r, top + h);
  } else if (f === "cylinder"){
    ctx.rect(cx - r * 0.7, top, s * 0.7, h);
  }
  ctx.closePath();
  ctx.fillStyle = "#0b0f14"; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,.28)"; ctx.lineWidth = 1.2; ctx.stroke();
}
function drawFiguresOnMast(ctx, figures, mastX, yTop, s){
  const gap = s * 0.35;
  let y = yTop;
  figures.forEach(f => {
    const h = figH(f, s);
    drawFigure(ctx, f, mastX, y, s, h);
    y += h + gap;
  });
}

// ─────────────────── Флаг на ветру: слайсы с синусоидой ───────────────────
let flagBuf = null;
function paintFlagWavy(ctx, draw, x, y, w, h, t){
  if (!flagBuf) flagBuf = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  flagBuf.width = Math.ceil(w * dpr); flagBuf.height = Math.ceil(h * dpr);
  const b = flagBuf.getContext("2d");
  b.setTransform(dpr, 0, 0, dpr, 0, 0);
  b.clearRect(0, 0, w, h);
  paintFlag(b, draw, 0, 0, w, h);
  const slice = 4;
  for (let sx = 0; sx < w; sx += slice){
    const k = sx / w;                                    // у мачты не колышется
    const dy = Math.sin(t * 3 + sx * 0.10) * 2.2 * k;
    ctx.drawImage(flagBuf, sx * dpr, 0, slice * dpr, h * dpr, x + sx, y + dy, slice, h);
  }
}
function paintFlag(ctx, draw, x, y, w, h){
  ctx.save();
  // контур: прямоугольник или «косицы» (swallowtail)
  ctx.beginPath();
  if (draw.shape === "swallowtail"){
    const cut = w * 0.28;
    ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w - cut, y + h / 2);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath();
  } else {
    ctx.rect(x, y, w, h);
  }
  ctx.clip();
  const cs = draw.colors || [];
  if (draw.kind === "solid"){
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w, h);
  } else if (draw.kind === "vsplit"){
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w / 2, h);
    ctx.fillStyle = cs[1]; ctx.fillRect(x + w / 2, y, w / 2, h);
  } else if (draw.kind === "hstripes"){
    const sh = h / cs.length;
    cs.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x, y + i * sh, w, sh + 0.5); });
  } else if (draw.kind === "vstripes"){
    const sw = w / cs.length;
    cs.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(x + i * sw, y, sw + 0.5, h); });
  } else if (draw.kind === "checker"){
    const n = draw.n || 4, cw = w / n, ch = h / n;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
      ctx.fillStyle = cs[(i + j) % 2]; ctx.fillRect(x + i * cw, y + j * ch, cw + 0.5, ch + 0.5);
    }
  } else if (draw.kind === "diag"){
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = cs[1];
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
  } else if (draw.kind === "center-rect"){
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = cs[1]; ctx.fillRect(x + w * 0.3, y + h * 0.3, w * 0.4, h * 0.4);
  } else if (draw.kind === "saltire"){
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = cs[1]; ctx.lineWidth = Math.min(w, h) * 0.2;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y + h);
    ctx.moveTo(x + w, y); ctx.lineTo(x, y + h); ctx.stroke();
  } else if (draw.kind === "nested"){
    // W: синий фон → белый прямоугольник → красный центр
    ctx.fillStyle = cs[0]; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = cs[1]; ctx.fillRect(x + w * 0.18, y + h * 0.18, w * 0.64, h * 0.64);
    ctx.fillStyle = cs[2]; ctx.fillRect(x + w * 0.36, y + h * 0.36, w * 0.28, h * 0.28);
  }
  ctx.restore();
  ctx.strokeStyle = "rgba(0,0,0,.25)"; ctx.lineWidth = 1;
  if (draw.shape !== "swallowtail") ctx.strokeRect(x, y, w, h);
}

// ─────────────────── Рендер: большая сцена (карточка/тест/меню) ───────────────────
// canvas.__item запоминается — анимационный цикл перерисовывает видимую сцену.
function renderItem(canvas, item, ts){
  canvas.__item = item;
  const t = (ts || performance.now()) / 1000;
  const { ctx, W, H } = fitCanvas(canvas);
  sceneBG(ctx, W, H, t);
  const v = drawVessel(ctx, W, H);
  drawMastLine(ctx, v.mastX, v.deckY, v.mastTop);
  if (item === "menu"){
    // витрина: флаг на топе + фигуры ниже (судно на мели: шар-ромб-шар)
    const fA = D.flags.find(f => f.key === "A");
    if (fA) paintFlagWavy(ctx, fA.draw, v.mastX + 3, v.mastTop + 2, W * 0.30, H * 0.16, t);
    drawFiguresOnMast(ctx, ["ball", "diamond", "ball"], v.mastX, v.mastTop + H * 0.20, Math.min(W, H) / 8);
  } else if (item.figures){
    const s = Math.min(W, H) / 6.4;
    const totalH = item.figures.reduce((a, f) => a + figH(f, s), 0) + s * 0.35 * (item.figures.length - 1);
    const yTop = Math.max(v.mastTop + 4, (v.deckY - totalH) * 0.45);
    drawFiguresOnMast(ctx, item.figures, v.mastX, yTop, s);
  } else if (item.draw.shape === "double"){
    // N над C (сигнал бедствия)
    const n = D.flags.find(f => f.key === "N"), c = D.flags.find(f => f.key === "C");
    const fw = W * 0.44, fh = H * 0.22;
    if (n) paintFlagWavy(ctx, n.draw, v.mastX + 3, v.mastTop + 4, fw, fh, t);
    if (c) paintFlagWavy(ctx, c.draw, v.mastX + 3, v.mastTop + 10 + fh, fw, fh, t + 0.7);
  } else {
    paintFlagWavy(ctx, item.draw, v.mastX + 3, v.mastTop + 6, W * 0.50, H * 0.30, t);
  }
}

// ─────────────────── Рендер: круглая мини-иконка списка ───────────────────
function renderIcon(canvas, item){
  const { ctx, W, H } = fitCanvas(canvas, 56, 56);
  const hor = H * 0.68;
  const sky = ctx.createLinearGradient(0, 0, 0, hor);
  sky.addColorStop(0, "#0a1830"); sky.addColorStop(1, "#28597b");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, hor);
  const sea = ctx.createLinearGradient(0, hor, 0, H);
  sea.addColorStop(0, "#175074"); sea.addColorStop(1, "#061c2e");
  ctx.fillStyle = sea; ctx.fillRect(0, hor, W, H - hor);
  ctx.fillStyle = "rgba(220,235,255,.5)";
  ctx.fillRect(W * 0.20, H * 0.14, 1.2, 1.2); ctx.fillRect(W * 0.75, H * 0.24, 1.2, 1.2);
  if (item.figures){
    const s = Math.min(W, H) / (item.figures.length > 1 ? 4.8 : 3.2);
    const gap = s * 0.3;
    const totalH = item.figures.reduce((a, f) => a + figH(f, s), 0) + gap * (item.figures.length - 1);
    let y = (H - totalH) / 2;
    ctx.strokeStyle = "#5a6b78"; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(W / 2, 2); ctx.lineTo(W / 2, y); ctx.stroke();
    item.figures.forEach(f => { const h = figH(f, s); drawFigure(ctx, f, W / 2, y, s, h); y += h + gap; });
  } else {
    const mx = W * 0.20;
    ctx.strokeStyle = "#5a6b78"; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(mx, 4); ctx.lineTo(mx, H - 6); ctx.stroke();
    if (item.draw.shape === "double"){
      const n = D.flags.find(f => f.key === "N"), c = D.flags.find(f => f.key === "C");
      if (n) paintFlag(ctx, n.draw, mx + 1, H * 0.14, W * 0.55, H * 0.30);
      if (c) paintFlag(ctx, c.draw, mx + 1, H * 0.52, W * 0.55, H * 0.30);
    } else {
      paintFlag(ctx, item.draw, mx + 1, H * 0.28, W * 0.58, H * 0.42);
    }
  }
}

// ─────────────────── Анимация: живут только видимые сцены ───────────────────
(function tickLoop(){
  function tick(ts){
    requestAnimationFrame(tick);
    ["menuScene", "viewCanvas", "quizCanvas"].forEach(id => {
      const c = document.getElementById(id);
      if (c && c.__item !== undefined && c.offsetParent !== null) renderItem(c, c.__item, ts);
    });
  }
  requestAnimationFrame(tick);
})();

// ─────────────────────── Справочник ───────────────────────
const show = id => document.getElementById(id).classList.remove("hidden");
const hide = id => document.getElementById(id).classList.add("hidden");
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let learnKind = "shapes";

function openLearn(kind){
  learnKind = kind;
  document.getElementById("learnTitle").textContent =
    kind === "shapes" ? I18N.t("shapeDay") : I18N.t("shapeFlags");
  const list = kind === "shapes" ? D.dayshapes : D.flags;
  const box = document.getElementById("learnList");
  box.innerHTML = "";
  list.forEach(item => {
    const b = document.createElement("button");
    b.className = "item";
    const c = document.createElement("canvas");
    b.appendChild(c);
    const t = document.createElement("div");
    t.innerHTML = `<div class="t">${esc(item.title || (item.key + " · " + item.name))}</div>
      <div class="m">${esc(item.meaning)}</div>`;
    b.appendChild(t);
    b.onclick = () => openView(item);
    box.appendChild(b);
    renderIcon(c, item);
  });
  hide("menu"); hide("view"); show("learn");
  window.scrollTo(0, 0);
}
function openView(item){
  document.getElementById("viewTitle").textContent = item.title || (item.key + " · " + item.name);
  document.getElementById("viewMeaning").textContent = item.meaning;
  document.getElementById("viewNote").textContent = item.note || "";
  renderItem(document.getElementById("viewCanvas"), item);
  hide("learn"); show("view");
  window.scrollTo(0, 0);
}
document.getElementById("goShapes").onclick = () => openLearn("shapes");
document.getElementById("goFlags").onclick = () => openLearn("flags");
renderItem(document.getElementById("menuScene"), "menu");   // витрина меню
document.getElementById("learnBack").onclick = () => { hide("learn"); show("menu"); };
document.getElementById("viewBack").onclick = () => { hide("view"); show("learn"); };

// ─────────────────────── Тест ───────────────────────
// Показ фигуры/флага + 3 значения (правильное + 2 «обманки» из того же
// раздела — фигуры путаются с фигурами, флаги с флагами).
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
let Q = null;   // {pool, idx, ok}

function startQuiz(){
  const pool = shuffle([...D.dayshapes, ...D.flags]);
  Q = { pool, idx: 0, ok: 0 };
  hide("menu"); show("quiz");
  document.getElementById("quizScore").textContent = "";
  window.scrollTo(0, 0);
  renderQuizQ();
}
function renderQuizQ(){
  const item = Q.pool[Q.idx];
  document.getElementById("quizCounter").textContent = `${Q.idx + 1} / ${Q.pool.length}`;
  renderItem(document.getElementById("quizCanvas"), item);
  const sameKind = item.figures ? D.dayshapes : D.flags;
  const wrong = shuffle(sameKind.filter(x => x !== item)).slice(0, 2);
  const opts = shuffle([item, ...wrong]);
  const box = document.getElementById("quizOpts");
  box.innerHTML = "";
  document.getElementById("quizCtrl").style.display = "none";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.className = "opt"; b.textContent = o.meaning;
    b.onclick = () => {
      const ok = o === item;
      if (ok) Q.ok++;
      haptic(ok ? "light" : "rigid");
      box.querySelectorAll(".opt").forEach(x => {
        x.disabled = true;
        if (x.textContent === item.meaning) x.classList.add("correct");
        else if (x === b && !ok) x.classList.add("wrong");
      });
      document.getElementById("quizCtrl").style.display = "flex";
    };
    box.appendChild(b);
  });
}
document.getElementById("quizNext").onclick = () => {
  if (Q.idx + 1 >= Q.pool.length){
    document.getElementById("quizScore").textContent =
      I18N.t("shapeResult", {ok: Q.ok, n: Q.pool.length});
    haptic("success");
    document.getElementById("quizCtrl").style.display = "none";
    document.getElementById("quizOpts").innerHTML = "";
    document.getElementById("quizQ").textContent = I18N.t("shapeDone");
    return;
  }
  Q.idx++;
  document.getElementById("quizQ").textContent = I18N.t("shapeWhat");
  renderQuizQ();
};
document.getElementById("goQuiz").onclick = startQuiz;
document.getElementById("quizBack").onclick = () => { hide("quiz"); show("menu"); };

// системная «Назад» Telegram: внутренние экраны → меню
window.__navBack = () => {
  if (!document.getElementById("view").classList.contains("hidden")){ hide("view"); show("learn"); return true; }
  if (!document.getElementById("learn").classList.contains("hidden")){ hide("learn"); show("menu"); return true; }
  if (!document.getElementById("quiz").classList.contains("hidden")){ hide("quiz"); show("menu"); return true; }
  return false;
};
</script>
